[package]
name = "app"
version = "0.1.1"
authors = ["Your Company"]
license = "LicenseRef-Commercial"
default-run = "app"
repository = "https://your-company.example.com/dbmanager"
description = "DBManager - multi-database management tool"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "json", "uuid"] }
oracle = { version = "0.6", features = ["chrono"] }
mongodb = "3"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
keyring = "3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
thiserror = "2"
parking_lot = "0.12"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
cron = "0.13"
dirs = "6"

# Patch sqlx-postgres with openGauss sha256 authentication support.
[patch.crates-io]
sqlx-postgres = { path = "vendor/sqlx-postgres" }
